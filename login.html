
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodVision AI | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#153c69,#071329 65%);color:#eef5ff;padding:20px}
.card{width:100%;max-width:410px;padding:32px;background:#102343;border:1px solid #31547c;border-radius:20px;box-shadow:0 20px 70px #0005}
h1{color:#63d9ff;margin-bottom:8px}
p{color:#b9cbe2;line-height:1.6}
label{display:block;margin:18px 0 8px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #385778;background:#071329;color:white}
button{width:100%;padding:14px;margin-top:22px;border:0;border-radius:9px;background:linear-gradient(90deg,#167dff,#27d3e8);color:white;font-weight:bold;font-size:16px;cursor:pointer}
.error{color:#ffb5c1;background:#481e2b;border-radius:8px;padding:10px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>🍽 FoodVision AI</h1>
  <p>Sign in to analyse food images using computer vision.</p>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="error">{{ message }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" type="password" name="password"
           autocomplete="current-password" required>

    <button type="submit">Login →</button>
  </form>
</div>
</body>
</html>
